<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wheelwise help</title>
  <style>
    :root { --ink: #1d2a24; --muted: #5d6b64; --brand: #1f7a55; --bg: #f4f7f5; --line: #d6dfda; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; min-height: 100vh; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    ol { list-style: none; padding: 0; margin: 0 0 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    li { padding: 10px 14px; border-radius: 12px; max-width: 85%; background: #fff; border: 1px solid var(--line); }
    li.user { align-self: flex-end; background: var(--brand); color: #fff; border-color: var(--brand); }
    li.error { border-color: #b3261e; color: #b3261e; }
    .sources { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
    button { padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { min-height: 1.5em; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Wheelwise help</h1>
    <p class="sub">Ask about bike hire, prices, bookings and our hubs.</p>
    <ol data-test="transcript" aria-label="Conversation" aria-live="polite"></ol>
    <p class="status" data-test="status" role="status"></p>
    <form data-test="chat-form">
      <input id="message" data-test="message-input" name="message" autocomplete="off" maxlength="1000"
             placeholder="Type your question" aria-label="Your question">
      <button type="submit" data-test="send-button" disabled>Send</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('[data-test="chat-form"]');
    const input = document.querySelector('[data-test="message-input"]');
    const button = document.querySelector('[data-test="send-button"]');
    const transcript = document.querySelector('[data-test="transcript"]');
    const status = document.querySelector('[data-test="status"]');

    const add = (role, text, sources) => {
      const li = document.createElement('li');
      li.className = role;
      li.dataset.test = role === 'user' ? 'user-message' : role === 'error' ? 'error-message' : 'bot-message';
      li.textContent = text;
      if (sources && sources.length) {
        const s = document.createElement('span');
        s.className = 'sources';
        s.dataset.test = 'sources';
        s.textContent = 'Sources: ' + sources.join(', ');
        li.appendChild(s);
      }
      transcript.appendChild(li);
    };

    input.addEventListener('input', () => { button.disabled = !input.value.trim(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add('user', message);
      input.value = '';
      button.disabled = true;
      input.disabled = true;
      status.textContent = 'Thinking...';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        add('bot', data.reply, data.sources);
      } catch (err) {
        add('error', 'Sorry, something went wrong. Please try again.');
      } finally {
        status.textContent = '';
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
