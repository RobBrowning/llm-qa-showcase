name: CI

# Every PR and push: offline checks, UI tests and the full eval on real models
# (about 4 minutes once models are cached). The hold-out set runs on main and
# on PRs labelled run-holdout only, so it stays out of the tuning loop.
# ADR 0001 and ADR 0005.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1' # Monday morning full eval catches drift in pinned inputs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:unit
      - run: npm run test:list

  ui:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 14

  eval:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Restore and save separately: a plain cache step only saves when the
      # job passes, so a failing eval re-downloaded every model on every run.
      - uses: actions/cache/restore@v5
        id: models
        with:
          path: .cache/models
          key: models-all-${{ hashFiles('src/app/config.ts', 'src/eval/config.ts') }}
          restore-keys: models-
      - run: npm run models:warm
      - uses: actions/cache/save@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          path: .cache/models
          key: ${{ steps.models.outputs.cache-primary-key }}
      - run: npm run data:fetch
      - run: npm run test:eval
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-eval
          path: playwright-report/
          retention-days: 30

  holdout:
    needs: check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-holdout')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Restore only: this job warms a subset of models, so it must not save.
      - uses: actions/cache/restore@v5
        id: models
        with:
          path: .cache/models
          key: models-all-${{ hashFiles('src/app/config.ts', 'src/eval/config.ts') }}
          restore-keys: models-
      - run: npm run models:warm -- bot
      - run: npm run test:holdout
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-holdout
          path: playwright-report/
          retention-days: 30
